<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clipLine1"><rect x="42" y="58" height="20"><animate attributeName="width" values="0;0;260;260;0" keyTimes="0;0.05;0.20;0.95;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipLine2"><rect x="42" y="84" height="20"><animate attributeName="width" values="0;0;350;350;0" keyTimes="0;0.20;0.35;0.95;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipLine3"><rect x="42" y="110" height="20"><animate attributeName="width" values="0;0;400;400;0" keyTimes="0;0.35;0.55;0.95;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipWelcome"><rect x="42" y="128" height="55"><animate attributeName="width" values="0;0;270;270;0" keyTimes="0;0.55;0.85;0.95;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .scanline { animation: scan 3s linear infinite; }
    @keyframes scan {
      0%   { transform: translateY(20px); opacity: 0; }
      10%  { opacity: 0.08; }
      90%  { opacity: 0.08; }
      100% { transform: translateY(180px); opacity: 0; }
    }
    .border { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .cursor { animation: blink 0.9s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .glow-pulse { animation: glowPulse 2.4s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  </style>

  <!-- terminal card -->
  <rect x="20" y="10" width="560" height="180" rx="14" fill="#0d1117"/>
  <rect class="border" x="20" y="10" width="560" height="180" rx="14" fill="none" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="42" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="86" cy="27" r="6" fill="#27c93f"/>
  <text x="300" y="31" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#8b949e">ayberk@control-systems: ~</text>
  <line x1="20" y1="44" x2="580" y2="44" stroke="#30363d" stroke-width="1"/>

  <!-- typed lines -->
  <g clip-path="url(#clipLine1)">
    <text x="42" y="72" font-family="'SFMono-Regular',Consolas,monospace" font-size="15">
      <tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> ./init_profile.sh</tspan>
    </text>
  </g>

  <g clip-path="url(#clipLine2)">
    <text x="42" y="98" font-family="'SFMono-Regular',Consolas,monospace" font-size="14" fill="#8b949e">&gt; loading control-systems module...</text>
  </g>

  <g clip-path="url(#clipLine3)">
    <text x="42" y="124" font-family="'SFMono-Regular',Consolas,monospace" font-size="14" fill="#58a6ff">✓ Ayberk Tuncel · EEE | Control &amp; Automation</text>
  </g>

  <!-- WELCOME with glow -->
  <g clip-path="url(#clipWelcome)">
    <text class="glow-pulse" x="42" y="172" font-family="'SFMono-Regular',Consolas,monospace" font-size="42" font-weight="800" letter-spacing="4" fill="#ffffff" filter="url(#glow)">WELCOME</text>
    <text x="42" y="172" font-family="'SFMono-Regular',Consolas,monospace" font-size="42" font-weight="800" letter-spacing="4" fill="#ffffff">WELCOME</text>
  </g>

  <!-- cursor -->
  <rect class="cursor" y="132" width="14" height="34" fill="#ffffff">
    <animate attributeName="x" values="42;42;312;312;42" keyTimes="0;0.55;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline -->
  <rect class="scanline" x="20" width="560" height="2" fill="#ffffff"/>
</svg>
