<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <style>
    .terminal-bg { fill: #0d1117; }
    .terminal-header { fill: #161b22; }
    .btn-red { fill: #ff5f56; }
    .btn-yellow { fill: #ffbd2e; }
    .btn-green { fill: #27c93f; }
    .title { fill: #8b949e; font-family: monospace; font-size: 13px; }
    .prompt { fill: #3fb950; font-family: monospace; font-size: 15px; font-weight: bold; }
    .text { fill: #ffffff; font-family: monospace; font-size: 15px; }
    .dim { fill: #8b949e; font-family: monospace; font-size: 15px; }
    .accent { fill: #58a6ff; font-family: monospace; font-size: 15px; }
    
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    .line1 { animation: fadeIn 0.5s ease-out 0.2s forwards; opacity: 0; }
    .line2 { animation: fadeIn 0.5s ease-out 0.8s forwards; opacity: 0; }
    .line3 { animation: fadeIn 0.5s ease-out 1.4s forwards; opacity: 0; }
    .line4 { animation: fadeIn 0.5s ease-out 2.0s forwards; opacity: 0; }
  </style>

  <!-- Terminal Window Frame -->
  <rect width="800" height="240" rx="10" class="terminal-bg" stroke="#30363d" stroke-width="1"/>
  
  <!-- Header Bar -->
  <path d="M 0 10 A 10 10 0 0 1 10 0 L 790 0 A 10 10 0 0 1 800 10 L 800 36 L 0 36 Z" class="terminal-header"/>
  
  <!-- Window Control Buttons -->
  <circle cx="24" cy="18" r="6" class="btn-red"/>
  <circle cx="44" cy="18" r="6" class="btn-yellow"/>
  <circle cx="64" cy="18" r="6" class="btn-green"/>
  
  <!-- Title -->
  <text x="400" y="22" text-anchor="middle" class="title">systems@boot: ~</text>
  
  <!-- Terminal Body Content -->
  <g transform="translate(30, 70)">
    <text x="0" y="0" class="line1">
      <tspan class="prompt">$ </tspan><tspan class="text">./boot_profile.sh</tspan>
    </text>
    
    <text x="0" y="35" class="line2">
      <tspan class="dim">&gt; initializing control modules...</tspan>
    </text>
    
    <text x="0" y="70" class="line3">
      <tspan class="green">✓ </tspan><tspan class="accent">status: ready</tspan>
    </text>
    
    <text x="0" y="115" class="line4">
      <tspan class="text" font-weight="bold" font-size="18" fill="#ffffff">WELCOME TO MY GITHUB PROFILE</tspan>
    </text>
  </g>
</svg>
