<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <style>
    .terminal-bg { fill: #0d1117; }
    .terminal-header { fill: #161b22; }
    .btn-red { fill: #ff5f56; }
    .btn-yellow { fill: #ffbd2e; }
    .btn-green { fill: #27c93f; }
    .title { fill: #8b949e; font-family: 'Consolas', monospace; font-size: 14px; }
    
    .code-text {
      font-family: 'Consolas', monospace;
      font-size: 15px;
      fill: #ffffff;
    }

    /* Büyütülen karşılama yazısı */
    .welcome-text {
      font-family: 'Consolas', monospace;
      font-size: 32px;
      font-weight: 900;
      fill: #ffffff;
      letter-spacing: 1px;
    }

    /* Harf harf daktilo efekti ve döngü sonunda ekranı komple silme */
    @keyframes type1 {
      0% { clip-path: inset(0 100% 0 0); }
      15%, 85% { clip-path: inset(0 0 0 0); }
      95%, 100% { clip-path: inset(0 100% 0 0); }
    }

    @keyframes type2 {
      0%, 15% { clip-path: inset(0 100% 0 0); }
      35%, 85% { clip-path: inset(0 0 0 0); }
      95%, 100% { clip-path: inset(0 100% 0 0); }
    }

    @keyframes type3 {
      0%, 35% { clip-path: inset(0 100% 0 0); }
      55%, 85% { clip-path: inset(0 0 0 0); }
      95%, 100% { clip-path: inset(0 100% 0 0); }
    }

    @keyframes type4 {
      0%, 55% { clip-path: inset(0 100% 0 0); }
      75%, 85% { clip-path: inset(0 0 0 0); }
      95%, 100% { clip-path: inset(0 100% 0 0); }
    }

    .line1 { animation: type1 9s infinite linear; }
    .line2 { animation: type2 9s infinite linear; }
    .line3 { animation: type3 9s infinite linear; }
    .line4 { animation: type4 9s infinite linear; }
  </style>

  <!-- Terminal Pencere Çerçevesi -->
  <rect width="800" height="240" rx="10" class="terminal-bg" stroke="#30363d" stroke-width="1"/>
  
  <!-- Üst Bar -->
  <path d="M 0 10 A 10 10 0 0 1 10 0 L 790 0 A 10 10 0 0 1 800 10 L 800 36 L 0 36 Z" class="terminal-header"/>
  
  <!-- Kontrol Butonları -->
  <circle cx="24" cy="18" r="6" class="btn-red"/>
  <circle cx="44" cy="18" r="6" class="btn-yellow"/>
  <circle cx="64" cy="18" r="6" class="btn-green"/>
  
  <!-- Başlık -->
  <text x="400" y="22" text-anchor="middle" class="title">systems@boot: ~ (@ayberktuncel)</text>
  
  <!-- Terminal İçeriği -->
  <g transform="translate(30, 70)">
    <g class="line1">
      <text x="0" y="0" class="code-text"><tspan fill="#3fb950" font-weight="bold">$ </tspan>./boot_profile.sh --user=ayberktuncel</text>
    </g>
    
    <g class="line2">
      <text x="0" y="35" class="code-text" fill="#8b949e">&gt; loading control systems &amp; automation modules...</text>
    </g>
    
    <g class="line3">
      <text x="0" y="70" class="code-text"><tspan fill="#3fb950">✓ </tspan><tspan fill="#58a6ff">status: @ayberktuncel is ready</tspan></text>
    </g>
    
    <g class="line4">
      <text x="0" y="125" class="welcome-text">WELCOME TO MY GITHUB PROFILE</text>
    </g>
  </g>
</svg>
